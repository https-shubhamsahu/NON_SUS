<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NO SUS feature graphic</title>
  <style>
    @font-face {
      font-family: Geist;
      src: url("../../homepage/public/eureka-pitch/fonts/geist-sans-latin-800.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1024px;
      height: 500px;
      background: #000000;
      overflow: hidden;
    }
    .frame {
      box-sizing: border-box;
      width: 1024px;
      height: 500px;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: Geist, sans-serif;
    }
    .wordmark {
      font-weight: 800;
      font-size: 96px;
      letter-spacing: -0.05em;
      line-height: 1;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
      color: #ffffff;
    }
    .stop {
      display: inline-block;
      width: 0.21em;
      height: 0.21em;
      background: #808080;
      margin-left: 0.08em;
      margin-bottom: 0.02em;
    }
    .tag {
      margin-top: 28px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">NO SUS<span class="stop" aria-hidden="true"></span></div>
    <div class="tag">Share documents. Know who opened them.</div>
  </div>
</body>
</html>
