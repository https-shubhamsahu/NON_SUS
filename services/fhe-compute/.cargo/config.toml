# Build configuration for the FHE compute microservice.
#
# tfhe-rs monomorphizes an enormous number of symbols. When linked with the
# MinGW/GNU toolchain (x86_64-pc-windows-gnu), its auto-generated PE export
# table overflows the export-ordinal limit, producing:
#     ld: error: export ordinal too large
# Passing `--exclude-all-symbols` to the linker suppresses the auto-export of
# every symbol and lets tfhe link cleanly. The setting is scoped to the GNU
# target only, so builds using the MSVC toolchain (the recommended toolchain
# for tfhe-rs on Windows) are unaffected.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-Wl,--exclude-all-symbols"]
