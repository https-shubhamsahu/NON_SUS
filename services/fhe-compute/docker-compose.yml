version: '3.8'

services:
  fhe-compute:
    build:
      context: .
      dockerfile: Dockerfile
    image: nosus/fhe-compute:latest
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - SERVICE_TOKEN=default-secure-fhe-token
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    
    # ─── DevSecOps Container Hardening ──────────────────────────────────────
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
      - /run:size=8M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    # AppArmor security profile
    # security_opt:
    #   - apparmor=docker-default
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
