apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhe-compute
  namespace: nosus
  labels:
    app: fhe-compute
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fhe-compute
  template:
    metadata:
      labels:
        app: fhe-compute
    spec:
      # --- Tenant Pod Security Context ---
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: fhe-compute-worker
        image: nosus/fhe-compute:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http-api
        
        # --- Container Security Hardening ---
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Enforce CPU & Memory Budget quotas
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"

        envFrom:
        - secretRef:
            name: fhe-compute-secrets

        # Temporary mount endpoints
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

        # Health Checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3

      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fhe-compute-svc
  namespace: nosus
spec:
  selector:
    app: fhe-compute
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
