name: Build and Release to Play Store

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing
        # Without this, android/key.properties never exists in CI, and
        # build.gradle.kts's signingConfigs.release correctly falls back to
        # the debug keystore instead — silently uploading a debug-signed
        # bundle to Play Store on every run. ANDROID_KEYSTORE_BASE64 is the
        # upload-keystore.jks file base64-encoded; see RELEASE_REPORT.md for
        # how it and the matching passwords were generated and where to set
        # these repo secrets.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define-from-file=.env

      # Direct-install APK attached to the GitHub Release — this is what the
      # in-app "Download App" button links to (remote config app_download_url
      # → github.com/…/releases/latest).
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env

      # GitHub Release FIRST: the website's "Download the App" button and the
      # in-app download URL both point at releases/latest, so the APK must
      # publish even if the Play upload below fails — which it will on the
      # very first run, because Google requires a new Play app's first
      # artifact to be uploaded manually through the Console UI before the
      # API is allowed to upload.
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Release ${{ github.ref_name || inputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            The attached `app-release.apk` is the direct-install build served
            by the website's and the app's "Download App" buttons.

            **Next Steps:**
            1. Test the app on devices via Google Play Console internal testing
            2. Promote to Closed Testing or Production when ready
            3. Monitor crash reports and ANRs in Play Console
          draft: false
          prerelease: false

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: foo.nosus.app
          releaseFiles: 'build/app/outputs/bundle/release/app-release.aab'
          track: internal
          status: completed
          inAppUpdatePriority: 3
          whatsnew: |
            Version ${{ github.ref_name || inputs.version }}
            See release notes for details.

      - name: Cleanup
        if: always()
        run: rm -f $HOME/.android/service-account-key.json .env android/key.properties android/app/upload-keystore.jks
