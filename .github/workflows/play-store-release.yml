name: Build and Release to Play Store

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5, matching gh-pages.yml — see the note there before bumping.
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          # Measure (measure.sh). Read twice from this one file: by
          # --dart-define-from-file for the Dart gate, and by
          # android/app/build.gradle.kts for the AndroidManifest meta-data the
          # native SDK needs. Empty unless both secrets are set, in which case
          # the SDK ships inert — see lib/config/measure_reporting_config.dart.
          echo "MEASURE_API_KEY=${{ secrets.MEASURE_API_KEY }}" >> .env
          echo "MEASURE_API_URL=${{ secrets.MEASURE_API_URL }}" >> .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing
        # Without this, android/key.properties never exists in CI, and
        # build.gradle.kts's signingConfigs.release correctly falls back to
        # the debug keystore instead — silently uploading a debug-signed
        # bundle to Play Store on every run. ANDROID_KEYSTORE_BASE64 is the
        # upload-keystore.jks file base64-encoded; see RELEASE_REPORT.md for
        # how it and the matching passwords were generated and where to set
        # these repo secrets.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Set up Firebase Cloud Messaging
        # google-services.json is git-ignored (public repo, per-project config),
        # so without this step the release build ships with push permanently
        # unavailable — PushService.initialize() would set _available = false on
        # every device and nobody would ever see a push notification.
        #
        # The write is conditional on purpose. app/build.gradle.kts applies the
        # google-services plugin only if the file exists, so no secret means a
        # working build without push. Writing an *empty* file would be worse
        # than writing none: the plugin would apply and then fail on malformed
        # JSON, breaking the release outright.
        #
        # Secret value: base64 of android/app/google-services.json, downloaded
        # from Firebase console → Project settings → Your apps → foo.nosus.app.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            python3 -c "import json,sys; d=json.load(open('android/app/google-services.json')); \
              pkgs=[c['client_info']['android_client_info']['package_name'] for c in d['client']]; \
              sys.exit(0) if 'foo.nosus.app' in pkgs else sys.exit('package_name mismatch: %s' % pkgs)"
            echo "FCM configured — push will be compiled in."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — building without push."
          fi

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define-from-file=.env

      # Direct-install APK attached to the GitHub Release — this is what the
      # in-app "Download App" button links to (remote config app_download_url
      # → github.com/…/releases/latest).
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env

      # GitHub Release FIRST: the website's "Download the App" button and the
      # in-app download URL both point at releases/latest, so the APK must
      # publish even if the Play upload below fails — which it will on the
      # very first run, because Google requires a new Play app's first
      # artifact to be uploaded manually through the Console UI before the
      # API is allowed to upload.
      - name: Create GitHub Release with APK
        # v3 is a pure runtime bump (Node 20 -> Node 24); every input used
        # below exists unchanged in v3, and it creates the release over the
        # GitHub API rather than `git push`, so it has none of the credential
        # -persistence coupling that pins checkout to v5 in gh-pages.yml.
        # Unverified by a real run: this workflow only fires on a v*.*.* tag,
        # so the first release cut after this is its first live exercise.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Release ${{ github.ref_name || inputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            The attached `app-release.apk` is the direct-install build served
            by the website's and the app's "Download App" buttons.

            **Next Steps:**
            1. Test the app on devices via Google Play Console internal testing
            2. Promote to Closed Testing or Production when ready
            3. Monitor crash reports and ANRs in Play Console
          draft: false
          prerelease: false

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: foo.nosus.app
          releaseFiles: 'build/app/outputs/bundle/release/app-release.aab'
          track: internal
          status: completed
          inAppUpdatePriority: 3
          whatsnew: |
            Version ${{ github.ref_name || inputs.version }}
            See release notes for details.

      - name: Cleanup
        if: always()
        run: rm -f $HOME/.android/service-account-key.json .env android/key.properties android/app/upload-keystore.jks
