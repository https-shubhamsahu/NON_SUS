<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="no_sus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>no_sus</title>
  <link rel="manifest" href="manifest.json">

  <!--
    supabase_flutter's Auth client wires up passkey/WebAuthn support by
    default, which pulls in the `passkeys_web` plugin. That plugin's
    registerWith() runs automatically on EVERY page load (Flutter Web plugin
    registration is unconditional, independent of whether the app ever uses
    passkeys) and calls `PasskeyAuthenticator.init()` unconditionally, even
    when this script hasn't loaded — crashing with
    "Cannot read properties of undefined (reading 'init')" on every page,
    including the SecureSend anonymous share link. This script (vendored
    locally instead of pointed at a GitHub releases URL, to avoid an external
    runtime dependency) defines the global `PasskeyAuthenticator` the plugin
    expects, so registration succeeds even though the app doesn't use passkeys.
    Must load BEFORE flutter_bootstrap.js (no async/defer) — Flutter's plugin
    registration runs during engine boot, not after DOMContentLoaded.
  -->
  <script src="passkeys-bundle.js"></script>
</head>
<body>
  <script>
    (function() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const hasCode = window.location.search.includes('code=') || window.location.hash.includes('access_token=');
      if (isMobile && hasCode) {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.backgroundColor = '#111';
        overlay.style.color = '#fff';
        overlay.style.fontFamily = 'Courier New, Courier, monospace';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = '30px';
        overlay.style.boxSizing = 'border-box';
        overlay.style.textAlign = 'center';

        overlay.innerHTML = `
          <div style="font-size: 40px; color: #a855f7; margin-bottom: 20px;">⚡</div>
          <h2 style="font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">LOGIN SUCCESSFUL</h2>
          <p style="color: #888; font-size: 13px; max-width: 320px; line-height: 1.5; margin-bottom: 30px;">
            Your login is authorized. Tap below to launch the NO SUS app and complete the session recovery.
          </p>
          <button id="open-app-btn" style="background-color: #a855f7; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; font-family: inherit; cursor: pointer; font-size: 12px; letter-spacing: 1px; width: 100%; max-width: 240px; box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);">
            OPEN NO SUS APP
          </button>
          <a id="continue-web-btn" href="#" style="color: #666; font-size: 11px; margin-top: 24px; text-decoration: underline; letter-spacing: 0.5px;">
            Continue in Browser
          </a>
        `;

        document.body.appendChild(overlay);

        document.getElementById('open-app-btn').addEventListener('click', function() {
          const params = window.location.search + window.location.hash;
          const redirectUri = 'io.supabase.nosus://login-callback' + params;
          window.location.href = redirectUri;
        });

        document.getElementById('continue-web-btn').addEventListener('click', function(e) {
          e.preventDefault();
          document.body.removeChild(overlay);
        });
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
