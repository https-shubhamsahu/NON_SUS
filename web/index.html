<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NO SUS — secure document sharing with watermarking, blur-until-touch protection, and tamper-evident audit logs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NO SUS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NO SUS</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Branded pre-boot loading screen — replaces Flutter Web's default blank
    page while its engine and assets download. It is intentionally inline and
    uses system fonts so it paints immediately without creating another
    network dependency. The native Flutter splash takes over after its first
    frame, using the same restrained palette and layout.
  -->
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-height: 100%; background: #0D0D0D; }
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #0D0D0D;
      color: #F5F5F5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 180ms ease-out;
    }
    #boot-loader.boot-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-loader .boot-content {
      width: min(100%, 352px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    #boot-loader .boot-symbol {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #F5F5F5;
      color: #111111;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -1px;
      line-height: 1;
    }
    #boot-loader .boot-mark {
      margin-top: 22px;
      color: inherit;
      font-size: clamp(23px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.1;
    }
    #boot-loader .boot-label {
      margin: 12px 0 0;
      color: #A3A3A3;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
    }
    #boot-loader .boot-progress {
      width: min(100%, 184px);
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 999px;
      background: #2B2B2B;
    }
    #boot-loader .boot-progress-fill {
      width: 46%;
      height: 100%;
      border-radius: inherit;
      background: #F5F5F5;
      animation: boot-progress 1.35s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    @keyframes boot-progress {
      from { transform: translateX(-70%); }
      to { transform: translateX(190%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-loader, #boot-loader .boot-progress-fill { transition: none; animation: none; }
      #boot-loader .boot-progress-fill { transform: translateX(26%); }
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #F5F5F3; }
      #boot-loader {
        background: #F5F5F3;
        color: #111111;
      }
      #boot-loader .boot-symbol { background: #111111; color: #FFFFFF; }
      #boot-loader .boot-label { color: #666666; }
      #boot-loader .boot-progress { background: #D7D7D4; }
      #boot-loader .boot-progress-fill { background: #111111; }
    }
    @media (max-height: 480px) {
      #boot-loader .boot-symbol { width: 44px; height: 44px; border-radius: 13px; font-size: 18px; }
      #boot-loader .boot-mark { margin-top: 16px; }
      #boot-loader .boot-progress { margin-top: 20px; }
    }
  </style>

  <!--
    supabase_flutter's Auth client wires up passkey/WebAuthn support by
    default, which pulls in the `passkeys_web` plugin. That plugin's
    registerWith() runs automatically on EVERY page load (Flutter Web plugin
    registration is unconditional, independent of whether the app ever uses
    passkeys) and calls `PasskeyAuthenticator.init()` unconditionally, even
    when this script hasn't loaded — crashing with
    "Cannot read properties of undefined (reading 'init')" on every page,
    including the SecureSend anonymous share link. This script (vendored
    locally instead of pointed at a GitHub releases URL, to avoid an external
    runtime dependency) defines the global `PasskeyAuthenticator` the plugin
    expects, so registration succeeds even though the app doesn't use passkeys.
    Must load BEFORE flutter_bootstrap.js (no async/defer) — Flutter's plugin
    registration runs during engine boot, not after DOMContentLoaded.
  -->
  <script src="passkeys-bundle.js"></script>
</head>
<body>
  <div id="boot-loader">
    <div class="boot-content" role="status" aria-live="polite" aria-label="Preparing NO SUS workspace">
      <div class="boot-symbol" aria-hidden="true">N</div>
      <div class="boot-mark">NO SUS</div>
      <p class="boot-label">Preparing your workspace</p>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-fill"></div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      // Flutter Web dispatches this once the engine paints its first real
      // frame — remove the boot loader then, with a generous timeout
      // fallback so a missed event (older engine builds, unusual load
      // paths) never leaves it stuck on screen forever.
      function hideBootLoader() {
        const el = document.getElementById('boot-loader');
        if (!el) return;
        el.classList.add('boot-hidden');
        setTimeout(function() { el.remove(); }, 200);
      }
      window.addEventListener('flutter-first-frame', hideBootLoader, { once: true });
      setTimeout(hideBootLoader, 12000);
    })();
  </script>
  <script>
    (function() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const hasCode = window.location.search.includes('code=') || window.location.hash.includes('access_token=');
      if (isMobile && hasCode) {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.background = 'radial-gradient(circle, #151515 0%, #0D0D0D 100%)';
        overlay.style.color = '#F5F5F5';
        overlay.style.fontFamily = "'VT323', monospace";
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = '30px';
        overlay.style.boxSizing = 'border-box';
        overlay.style.textAlign = 'center';

        overlay.innerHTML = `
          <div style="font-size: 56px; color: #FFFFFF; margin-bottom: 24px; letter-spacing: 2px;">[//]</div>
          <h2 style="font-size: 32px; font-weight: bold; letter-spacing: 2px; margin-top: 0; margin-bottom: 12px; color: #FFFFFF;">AUTHENTICATING SESSION</h2>
          <p style="color: #999999; font-size: 14px; max-width: 320px; line-height: 1.5; margin-bottom: 36px; font-family: 'Courier New', monospace;">
            Your credentials have been verified. Tap below to launch the NO SUS native app client.
          </p>
          <button id="open-app-btn" style="background-color: #FFFFFF; color: #0D0D0D; border: 1.5px solid #FFFFFF; padding: 16px 32px; border-radius: 0; font-weight: bold; font-family: inherit; cursor: pointer; font-size: 20px; letter-spacing: 1.5px; width: 100%; max-width: 260px; box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05); transition: background-color 0.2s;">
            LAUNCH APP
          </button>
          <a id="continue-web-btn" href="#" style="color: #666666; font-size: 16px; margin-top: 28px; text-decoration: underline; letter-spacing: 1px;">
            Continue in Browser
          </a>
        `;

        document.body.appendChild(overlay);

        document.getElementById('open-app-btn').addEventListener('click', function() {
          const params = window.location.search + window.location.hash;
          const redirectUri = 'io.supabase.nosus://login-callback' + params;
          window.location.href = redirectUri;
        });

        document.getElementById('continue-web-btn').addEventListener('click', function(e) {
          e.preventDefault();
          document.body.removeChild(overlay);
        });
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
