<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NO SUS — secure document sharing with watermarking, blur-until-touch protection, and tamper-evident audit logs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NO SUS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NO SUS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!--
    Branded pre-boot loading screen — replaces the default blank white page
    Flutter Web shows while the engine/assets download. Pure inline CSS (no
    extra network request) so it paints on the very first frame, before any
    script runs, eliminating the white flash. Colors track the OS-level
    prefers-color-scheme so it matches whichever theme lib/screens/
    splash_screen.dart (VideoSplashScreen) will hand off to — same palette:
    #FAFAFA/#0A0A0A. Removed via the 'flutter-first-frame' event Flutter Web
    dispatches once the real first frame is painted (with a timeout fallback
    in case that event is ever missed, so a slow load never gets stuck behind
    the overlay forever).
  -->
  <style>
    html, body {
      background: #0A0A0A;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0A0A0A;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
      transition: opacity 0.4s ease-out;
    }
    #boot-loader.boot-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-loader .boot-mark {
      font-family: 'VT323', 'Courier New', monospace;
      font-size: 40px;
      letter-spacing: 6px;
      color: #F5F5F5;
      image-rendering: pixelated;
    }
    #boot-loader .boot-bar {
      display: flex;
      gap: 6px;
      margin-top: 22px;
    }
    #boot-loader .boot-block {
      width: 10px;
      height: 10px;
      background-color: #F5F5F5;
      opacity: 0.2;
      animation: boot-pulse 1.1s ease-in-out infinite;
    }
    #boot-loader .boot-block:nth-child(2) { animation-delay: 0.12s; }
    #boot-loader .boot-block:nth-child(3) { animation-delay: 0.24s; }
    #boot-loader .boot-block:nth-child(4) { animation-delay: 0.36s; }
    #boot-loader .boot-block:nth-child(5) { animation-delay: 0.48s; }
    @keyframes boot-pulse {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 1; }
    }
    #boot-loader .boot-label {
      margin-top: 18px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #999999;
    }
    /* Light-mode overrides collected in one block, placed last, so they win
       the cascade over the (equal-specificity) dark-mode rules above
       regardless of source order elsewhere in this stylesheet. */
    @media (prefers-color-scheme: light) {
      html, body { background: #FAFAFA; }
      #boot-loader {
        background-color: #FAFAFA;
        background-image:
          repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 3px),
          repeating-linear-gradient(90deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px);
      }
      #boot-loader .boot-mark { color: #0A0A0A; }
      #boot-loader .boot-block { background-color: #0A0A0A; }
      #boot-loader .boot-label { color: #555555; }
    }
  </style>

  <!--
    supabase_flutter's Auth client wires up passkey/WebAuthn support by
    default, which pulls in the `passkeys_web` plugin. That plugin's
    registerWith() runs automatically on EVERY page load (Flutter Web plugin
    registration is unconditional, independent of whether the app ever uses
    passkeys) and calls `PasskeyAuthenticator.init()` unconditionally, even
    when this script hasn't loaded — crashing with
    "Cannot read properties of undefined (reading 'init')" on every page,
    including the SecureSend anonymous share link. This script (vendored
    locally instead of pointed at a GitHub releases URL, to avoid an external
    runtime dependency) defines the global `PasskeyAuthenticator` the plugin
    expects, so registration succeeds even though the app doesn't use passkeys.
    Must load BEFORE flutter_bootstrap.js (no async/defer) — Flutter's plugin
    registration runs during engine boot, not after DOMContentLoaded.
  -->
  <script src="passkeys-bundle.js"></script>
</head>
<body>
  <div id="boot-loader">
    <div class="boot-mark">NO SUS</div>
    <div class="boot-bar">
      <div class="boot-block"></div>
      <div class="boot-block"></div>
      <div class="boot-block"></div>
      <div class="boot-block"></div>
      <div class="boot-block"></div>
    </div>
    <div class="boot-label">LOADING SECURE WORKSPACE</div>
  </div>
  <script>
    (function() {
      // Flutter Web dispatches this once the engine paints its first real
      // frame — remove the boot loader then, with a generous timeout
      // fallback so a missed event (older engine builds, unusual load
      // paths) never leaves it stuck on screen forever.
      function hideBootLoader() {
        const el = document.getElementById('boot-loader');
        if (!el) return;
        el.classList.add('boot-hidden');
        setTimeout(function() { el.remove(); }, 450);
      }
      window.addEventListener('flutter-first-frame', hideBootLoader, { once: true });
      setTimeout(hideBootLoader, 12000);
    })();
  </script>
  <script>
    (function() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const hasCode = window.location.search.includes('code=') || window.location.hash.includes('access_token=');
      if (isMobile && hasCode) {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.background = 'radial-gradient(circle, #151515 0%, #0D0D0D 100%)';
        overlay.style.color = '#F5F5F5';
        overlay.style.fontFamily = "'VT323', monospace";
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = '30px';
        overlay.style.boxSizing = 'border-box';
        overlay.style.textAlign = 'center';

        overlay.innerHTML = `
          <div style="font-size: 56px; color: #FFFFFF; margin-bottom: 24px; letter-spacing: 2px;">[//]</div>
          <h2 style="font-size: 32px; font-weight: bold; letter-spacing: 2px; margin-top: 0; margin-bottom: 12px; color: #FFFFFF;">AUTHENTICATING SESSION</h2>
          <p style="color: #999999; font-size: 14px; max-width: 320px; line-height: 1.5; margin-bottom: 36px; font-family: 'Courier New', monospace;">
            Your credentials have been verified. Tap below to launch the NO SUS native app client.
          </p>
          <button id="open-app-btn" style="background-color: #FFFFFF; color: #0D0D0D; border: 1.5px solid #FFFFFF; padding: 16px 32px; border-radius: 0; font-weight: bold; font-family: inherit; cursor: pointer; font-size: 20px; letter-spacing: 1.5px; width: 100%; max-width: 260px; box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05); transition: background-color 0.2s;">
            LAUNCH APP
          </button>
          <a id="continue-web-btn" href="#" style="color: #666666; font-size: 16px; margin-top: 28px; text-decoration: underline; letter-spacing: 1px;">
            Continue in Browser
          </a>
        `;

        document.body.appendChild(overlay);

        document.getElementById('open-app-btn').addEventListener('click', function() {
          const params = window.location.search + window.location.hash;
          const redirectUri = 'io.supabase.nosus://login-callback' + params;
          window.location.href = redirectUri;
        });

        document.getElementById('continue-web-btn').addEventListener('click', function(e) {
          e.preventDefault();
          document.body.removeChild(overlay);
        });
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
